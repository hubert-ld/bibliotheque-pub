# Rayons personnels, façon librairie : un rayon par genre, puis tri par auteur.
# Cote affichée : "<abbr> <3 lettres de l'auteur>", ex. "ROMF DUR".
#
# Les règles sont lues dans l'ordre : la première qui correspond gagne.
# Conditions possibles (toutes doivent être vraies ; dans une liste, une seule suffit) :
#   bd = true/false         bande dessinée (cadre BnF 805, Dewey 741.5 ou sujets)
#   fiction = true/false    roman, nouvelles, récit
#   public = ["jeunesse", "ado", "adulte"]
#   forme = ["poesie", "theatre", "fiction", "nouvelles", "essai", "documentaire", ...]
#   dewey = ["84", "741.5"]  (début de l'indice Dewey)
#   cadre = ["803"]          (début du code du cadre BnF)
#   langue = ["fre"] / langue_non = ["fre"]   (langue d'origine)
#   mots = ["policier", "@policier"]          (texte ou liste de mots.toml)
# Modifiez librement puis lancez :  biblio reclassify

[[regle]]
abbr = "MAN"
libelle = "Mangas"
bd = true
mots = ["@manga"]

