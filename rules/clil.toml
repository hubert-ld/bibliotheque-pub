# Classification Clil : celle des libraires et éditeurs français
# (rayons Fnac, Decitre, librairies indépendantes).
#
# IMPORTANT : le code Clil d'un livre est attribué par l'éditeur et diffusé par
# Electre / Dilicom, services payants. Aucune source gratuite ne le fournit.
# Il est donc DÉDUIT ici, par famille et sous-famille (libellés Clil), à partir
# du cadre BnF, du Dewey, du public et des mots-clés. Le champ `code` est vide :
# vous pouvez y mettre le code Clil officiel à 4 chiffres si vous le connaissez.
#
# Même syntaxe de conditions que rayons.toml. Première règle qui correspond = gagnante.

