# Classification décimale universelle (CDU)
#
# Utilisée surtout en Belgique, en Suisse et dans les CDI. La BnF la fournit
# rarement (zone 675) : elle est donc le plus souvent déduite du Dewey,
# à la classe ou sous-classe près.

# Littérature : 821 + langue + genre (ex. roman français = 821.133.1-31)
[litterature]
fre = ".133.1"
eng = ".111"
ger = ".112.2"
dut = ".112.5"
ita = ".131.1"
spa = ".134.2"
por = ".134.3"
lat = ".124"
grc = ".14"
gre = ".14"
rus = ".161.1"
pol = ".162.1"
heb = ".411.16"
ara = ".411.21"
jpn = ".521"
chi = ".581"

# Quand la langue est inconnue, le 2e chiffre du Dewey la donne
[litterature_dewey]
"81" = ".111"
"82" = ".111"
"83" = ".112.2"
"84" = ".133.1"
"85" = ".131.1"
"86" = ".134.2"
"87" = ".124"
"88" = ".14"

[genres]
poesie = "-1"
theatre = "-2"
fiction = "-31"
nouvelles = "-32"
essai = "-4"
discours = "-5"
lettres = "-6"
humour = "-7"
mixte = "-8"

# Chiffre de genre Dewey -> auxiliaire CDU (quand la forme est inconnue)
