[project]
name = "biblio"
version = "0.4.1"
description = "Personal library software: barcode scanning, places, Dewey/UDC/Clil/Thema/custom classifications"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
    "openpyxl>=3.1",
    "cryptography>=50.0.2",
    "segno>=1.6.6",
    "markdown-it-py>=3.0",
]

[project.scripts]
biblio = "biblio.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biblio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
